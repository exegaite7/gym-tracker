<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONLOG · Registro de pesos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1) TOKENS DE DISEÑO
   Por qué: si todos los colores/tamaños viven acá, cambiar
   la estética de toda la página es tocar UNA sola línea.
   ========================================================= */
:root{
  --blue-950:#04112e;  /* fondo profundo */
  --blue-800:#0a2a6b;
  --blue-600:#1453c9;
  --accent:#1d5fe0;    /* único color de acento (botones, barras) */
  --accent-hi:#5c9bff;
  --ink:#f4f7ff;       /* texto principal */
  --ink-soft:#b9c6e6;  /* texto secundario */
  --glass:rgba(255,255,255,.08);
  --glass-line:rgba(255,255,255,.16);
  --card:#ffffff;      /* tarjeta blanca tipo "This Week Progress" */
  --card-ink:#0b1630;
  --danger:#ff5c6c;

  --font-display:'Anton', 'Impact', sans-serif;
  --font-text:'Barlow', system-ui, sans-serif;

  /* Escala tipográfica con saltos grandes */
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:24px; --fs-xl:40px; --fs-hero:clamp(56px, 11vw, 148px);

  /* Espaciado en grilla de 8px */
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px; --s7:64px;
  --r-sm:12px; --r-md:20px; --r-lg:28px;
  --t:200ms ease;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-text); color:var(--ink); min-height:100vh;
  /* El "glow" azul del ejemplo: varios degradados radiales apilados */
  background:
    radial-gradient(900px 600px at 70% -10%, rgba(92,155,255,.45), transparent 60%),
    radial-gradient(700px 500px at 0% 40%, rgba(20,83,201,.55), transparent 60%),
    linear-gradient(180deg, var(--blue-800), var(--blue-950) 70%);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s4)}

/* ---------- Barra de navegación ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s4) 0}
.logo{font-family:var(--font-display);font-size:var(--fs-lg);letter-spacing:1px;text-decoration:none;color:var(--ink);font-style:italic}
.logo b{color:var(--accent-hi)}
.nav-links{display:flex;gap:var(--s1);flex-wrap:wrap;justify-content:center}
.nav-links a{color:var(--ink-soft);text-decoration:none;font-size:var(--fs-sm);padding:var(--s2) var(--s3);border-radius:999px;transition:var(--t)}
.nav-links a:hover,.nav-links a.on{color:var(--ink);background:var(--glass)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;gap:var(--s2);border:0;border-radius:999px;padding:var(--s3) var(--s4);font-weight:600;font-size:var(--fs-sm);transition:var(--t);text-decoration:none}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(47,123,255,.45)}
.btn-primary:hover{background:#1652c4;transform:translateY(-2px)}
.btn-ghost{background:var(--glass);border:1px solid var(--glass-line);color:var(--ink)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}
.btn-sm{padding:var(--s2) var(--s3);font-size:var(--fs-xs)}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);display:grid;place-items:center;transition:var(--t);font-size:var(--fs-md);line-height:1}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.icon-btn.danger:hover{background:var(--danger);border-color:var(--danger)}

/* ---------- Hero ---------- */
.hero{position:relative;text-align:center;padding:var(--s5) 0 var(--s6)}
.eyebrow{font-size:var(--fs-xs);letter-spacing:3px;text-transform:uppercase;color:var(--accent-hi);font-weight:700}
.hero h1{font-family:var(--font-display);font-size:var(--fs-hero);line-height:.9;text-transform:uppercase;letter-spacing:1px;margin:var(--s3) 0;
  color:#fff;text-shadow:0 8px 40px rgba(4,17,46,.45)}
.hero p{color:var(--ink-soft);max-width:460px;margin:0 auto var(--s4)}

/* ---------- Tarjetas de vidrio ---------- */
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-md);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stats{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:var(--s3);margin-top:var(--s5);text-align:left}
.stat{padding:var(--s4)}
.stat .big{font-family:var(--font-display);font-size:var(--fs-xl);line-height:1}
.stat small{color:var(--ink-soft);font-size:var(--fs-sm)}
.progress-card{background:var(--card);color:var(--card-ink);border-radius:var(--r-md);padding:var(--s4)}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-sm);font-weight:600}
.progress-head strong{font-size:var(--fs-lg)}
.bar{height:10px;border-radius:999px;background:#e3e9f7;margin:var(--s3) 0;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue-600),var(--accent-hi));border-radius:inherit;transition:width .6s ease}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.mini-grid div{border-left:1px solid #e3e9f7;padding-left:var(--s2)}
.mini-grid div:first-child{border:0;padding:0}
.mini-grid small{display:block;color:#5a6785;font-size:var(--fs-xs)}
.mini-grid b{font-size:var(--fs-md)}

/* ---------- Secciones ---------- */
section{padding:var(--s6) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.sec-head h2{font-family:var(--font-display);font-size:var(--fs-xl);text-transform:uppercase;letter-spacing:.5px;line-height:1}
.sec-head p{color:var(--ink-soft);font-size:var(--fs-sm)}

/* ---------- Tarjetas de días (accesos directos) ---------- */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3)}
.day-card{position:relative;overflow:hidden;text-decoration:none;color:var(--ink);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);transition:var(--t);min-height:260px}
.day-card:hover{transform:translateY(-6px);border-color:var(--accent-hi);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.day-card .num{font-family:var(--font-display);font-size:var(--fs-sm);color:var(--accent-hi)}
.day-card h3{font-family:var(--font-display);font-size:32px;text-transform:uppercase;line-height:1}
.day-card .ill{border-radius:var(--r-sm);overflow:hidden;margin-top:auto}
.day-card small{color:var(--ink-soft);font-size:var(--fs-xs)}

/* ---------- Registro semanal ---------- */
.week-nav{display:flex;align-items:center;gap:var(--s2)}
.week-nav span{font-weight:600;font-size:var(--fs-sm);min-width:190px;text-align:center}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2)}
.wd{padding:var(--s3);min-height:120px;display:flex;flex-direction:column;gap:var(--s2)}
.wd.today{border-color:var(--accent-hi)}
.wd .dname{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:2px;color:var(--ink-soft)}
.wd .dnum{font-family:var(--font-display);font-size:var(--fs-lg)}
.chip{display:inline-block;font-size:var(--fs-xs);font-weight:700;padding:var(--s1) var(--s2);border-radius:999px;background:var(--accent);color:#fff;text-decoration:none}
.chip:hover{background:#1652c4}
.week-table{margin-top:var(--s4);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th,td{text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--glass-line)}
th{color:var(--ink-soft);font-weight:500;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:1px}
.empty{color:var(--ink-soft);font-size:var(--fs-sm);padding:var(--s4);text-align:center}

/* ---------- Vista de un día ---------- */
.day-hero{display:flex;justify-content:space-between;align-items:end;gap:var(--s4);flex-wrap:wrap;padding:var(--s4) 0}
.day-hero h1{margin-top:var(--s2);font-family:var(--font-display);font-size:clamp(56px,10vw,120px);text-transform:uppercase;line-height:.9}
.date-box{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-width:240px}
.date-box label{font-size:var(--fs-xs);color:var(--ink-soft);text-transform:uppercase;letter-spacing:2px}
.date-box input{background:rgba(0,0,0,.25);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);color-scheme:dark}
.status{font-size:var(--fs-xs);color:var(--accent-hi);font-weight:600}

.ex-list{display:grid;gap:var(--s3)}
.ex{display:grid;grid-template-columns:200px 1fr;gap:var(--s4);padding:var(--s3);align-items:start}
.ex .ill{border-radius:var(--r-sm);overflow:hidden}
.ex-top{display:flex;justify-content:space-between;gap:var(--s2);align-items:start}
.ex h3{font-size:var(--fs-lg);font-weight:700;line-height:1.15}
.tag{font-size:var(--fs-xs);color:var(--ink-soft)}
.ex-actions{display:flex;gap:var(--s1)}
.hint{font-size:var(--fs-xs);color:var(--accent-hi);margin-top:var(--s1)}

/* Selector Total / Por lado (segmented control) */
.seg{display:inline-flex;background:rgba(0,0,0,.25);border:1px solid var(--glass-line);border-radius:999px;padding:3px;margin:var(--s3) 0}
.seg button{border:0;background:transparent;padding:6px var(--s3);border-radius:999px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-soft);transition:var(--t)}
.seg button.on{background:var(--accent);color:#fff}

.sets{display:grid;gap:var(--s2)}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr auto 32px;gap:var(--s2);align-items:center}
.set-row .n{font-family:var(--font-display);color:var(--ink-soft)}
.field{display:flex;align-items:center;background:rgba(0,0,0,.25);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:0 var(--s2)}
.field:focus-within{border-color:var(--accent-hi)}
.field input{width:100%;background:transparent;border:0;padding:var(--s2) var(--s1);outline:none;min-width:0}
.field span{font-size:var(--fs-xs);color:var(--ink-soft);white-space:nowrap}
.total{font-size:var(--fs-xs);color:var(--ink-soft);min-width:72px;text-align:right}
.add-set{justify-self:start;margin-top:var(--s1)}

.save-bar{position:sticky;bottom:var(--s3);margin-top:var(--s4);padding:var(--s3);display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;z-index:5;background:rgba(10,42,107,.75)}

.history{display:grid;gap:var(--s2)}

/* ---------- Aviso "rutina cargada" ---------- */
.banner{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3);margin-bottom:var(--s3);border-color:var(--accent-hi);flex-wrap:wrap}
.banner small{display:block;color:var(--ink-soft);font-size:var(--fs-sm)}
.link-btn{background:none;border:0;color:var(--ink);text-decoration:underline;font-size:var(--fs-xs);font-weight:600;margin-left:var(--s2)}
.link-btn:hover{color:var(--accent-hi)}

/* ---------- Calendario ---------- */
.cal-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--s3);align-items:start}
.cal{padding:var(--s3)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s3);font-size:var(--fs-lg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1)}
.cal-wd{font-size:var(--fs-xs);color:var(--ink-soft);text-align:center;text-transform:uppercase;letter-spacing:1px;padding-bottom:var(--s1)}
.cal-day{min-height:72px;border-radius:var(--r-sm);background:rgba(0,0,0,.2);border:1px solid transparent;padding:var(--s1) var(--s2);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px;transition:var(--t)}
.cal-day:hover{border-color:var(--glass-line)}
.cal-day span{font-weight:600;font-size:var(--fs-sm)}
.cal-day.out{opacity:.35}
.cal-day.today{border-color:var(--accent-hi)}
.cal-day.sel{background:var(--accent)}
.cal-day.has:not(.sel){background:rgba(29,95,224,.3)}
.dot{font-style:normal;font-size:10px;font-weight:700;background:#fff;color:var(--card-ink);border-radius:999px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-detail{padding:var(--s4);position:sticky;top:var(--s3)}
.det-title{font-size:var(--fs-lg);text-transform:capitalize;margin-bottom:var(--s3)}
.det-session{display:grid;gap:var(--s2);margin-bottom:var(--s4)}
.det-top{display:flex;justify-content:space-between;align-items:center}
.det-ex{padding:var(--s2) 0;border-bottom:1px solid var(--glass-line)}
.det-ex b{display:block;font-size:var(--fs-md)}
.det-ex small{color:var(--ink-soft);font-size:var(--fs-sm)}
.select{background:rgba(0,0,0,.3);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);min-width:220px}
.select option{color:#000}
.prog-sum{padding:var(--s3);font-size:var(--fs-md);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.delta{font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft)}
.delta.up{color:#5ee69b}
.delta.down{color:var(--danger)}
td a{color:var(--ink)}
.h-item{padding:var(--s3);display:flex;justify-content:space-between;gap:var(--s3);align-items:center;flex-wrap:wrap}
.h-item b{display:block}
.h-item small{color:var(--ink-soft)}
.week-label{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:2px;color:var(--accent-hi);margin-top:var(--s3)}

/* ---------- Modal agregar ejercicio ---------- */
.modal{position:fixed;inset:0;background:rgba(2,8,24,.7);display:none;align-items:center;justify-content:center;padding:var(--s3);z-index:20}
.modal.open{display:flex}
.modal-box{width:min(760px,100%);max-height:90vh;overflow:auto;padding:var(--s4);background:linear-gradient(180deg,#0d2f78,#061a45)}
.modal-box h2{font-family:var(--font-display);font-size:var(--fs-xl);text-transform:uppercase;margin-bottom:var(--s3)}
.form-row{display:grid;gap:var(--s2);margin-bottom:var(--s3)}
.form-row label{font-size:var(--fs-xs);color:var(--ink-soft);text-transform:uppercase;letter-spacing:2px}
.form-row input[type=text]{background:rgba(0,0,0,.25);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:var(--s3)}
.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.equip{border:2px solid transparent;border-radius:var(--r-sm);background:rgba(0,0,0,.2);padding:var(--s1);text-align:center;font-size:var(--fs-xs);font-weight:600;transition:var(--t)}
.equip:hover{border-color:var(--glass-line)}
.equip.on{border-color:var(--accent-hi)}
.equip svg{display:block;border-radius:8px;margin-bottom:var(--s1)}
.modal-actions{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s4)}

.toast{position:fixed;left:50%;bottom:var(--s5);transform:translate(-50%,120px);background:var(--card);color:var(--card-ink);padding:var(--s3) var(--s4);border-radius:999px;font-weight:600;font-size:var(--fs-sm);transition:transform .3s ease;z-index:30}
.toast.show{transform:translate(-50%,0)}

footer{color:var(--ink-soft);font-size:var(--fs-xs);text-align:center;padding:var(--s6) 0 var(--s5)}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .cal-layout{grid-template-columns:1fr}
  .cal-detail{position:static}
  .days{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:1fr 1fr}
  .stats .progress-card{grid-column:1/-1;order:-1}
}
@media (max-width:720px){
  .nav-links{display:none}
  .days{grid-template-columns:1fr 1fr}
  .week-grid{grid-template-columns:repeat(4,1fr)}
  .ex{grid-template-columns:1fr}
  .cal-day{min-height:52px;padding:2px}
  .dot{font-size:0;width:8px;height:8px;padding:0}
  .ex .ill{max-width:260px}
  .equip-grid{grid-template-columns:repeat(2,1fr)}
  .mini-grid{grid-template-columns:1fr 1fr;row-gap:var(--s2)}
  .mini-grid div:nth-child(3){border:0;padding:0}
}
@media (max-width:420px){
  .wrap{padding:0 var(--s3)}
  .days{grid-template-columns:1fr}
  .week-grid{grid-template-columns:repeat(2,1fr)}
  .set-row{grid-template-columns:20px 1fr 1fr 32px}
  .set-row .total{display:none}
}
</style>
</head>
<body>

<div class="wrap">
  <nav class="nav">
    <a class="logo" href="#/">IRON<b>LOG</b>+</a>
    <div class="nav-links" id="navLinks"></div>
    <a class="btn btn-ghost btn-sm" href="#/" aria-label="Inicio">Inicio ↗</a>
  </nav>
  <main id="app"></main>
  <footer>Tus datos se guardan en este navegador (localStorage). · IRONLOG</footer>
</div>

<!-- Modal para agregar ejercicio -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box glass">
    <h2 id="modalTitle">Nuevo ejercicio</h2>
    <div class="form-row">
      <label for="exName">Nombre del ejercicio</label>
      <input type="text" id="exName" placeholder="Ej: Press inclinado en máquina" maxlength="60">
    </div>
    <div class="form-row">
      <label>Tipo de equipo (define la ilustración)</label>
      <div class="equip-grid" id="equipGrid"></div>
    </div>
    <div class="form-row">
      <label>¿Cómo anotás el peso?</label>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="total" class="on">Peso total</button>
        <button type="button" data-mode="lado">Por lado</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelEx">Cancelar</button>
      <button class="btn btn-primary" id="saveEx">Agregar a la rutina</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   2) ILUSTRACIONES SVG
   Por qué SVG y no fotos: son código, pesan casi nada, se ven
   nítidas en cualquier tamaño y no dependen de internet.
   Cada persona se arma con "huesos": líneas gruesas con puntas
   redondeadas. Así, cambiando coordenadas, cambia la pose.
   ========================================================= */
const C = { bg:'#0d0d0f', metal:'#6e737b', metalDk:'#3b3f45', skin:'#f1ede6', line:'#111', shirt:'#f5c518', shorts:'#151515', shoe:'#fafafa' };

// Una extremidad = borde oscuro grueso + relleno claro encima (efecto "contorno")
function limb(pts, w = 9, color = C.skin) {
  const d = 'M' + pts.map(p => p.join(',')).join(' L');
  return `<path d="${d}" fill="none" stroke="${C.line}" stroke-width="${w + 4}" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

// Persona completa. p = {head, sh, hp, armB, armF, legB, legF}
// armB/legB = brazo/pierna de atrás (se dibuja primero y más oscuro)
function person(p) {
  const back = '#cfc9bf';
  let s = '';
  s += limb([p.hp, ...p.legB], 10, back) + foot(p.legB.at(-1));
  s += limb([p.sh, ...p.armB], 8, back);
  // Torso (remera amarilla) y short
  s += `<path d="M${p.sh} L${p.hp}" stroke="${C.line}" stroke-width="26" stroke-linecap="round"/>
        <path d="M${p.sh} L${p.hp}" stroke="${C.shirt}" stroke-width="22" stroke-linecap="round"/>`;
  const mid = [(p.hp[0] * 2 + p.legF[0][0]) / 3, (p.hp[1] * 2 + p.legF[0][1]) / 3];
  s += `<path d="M${p.hp} L${mid}" stroke="${C.shorts}" stroke-width="20" stroke-linecap="round"/>`;
  // Rayito en la remera (detalle de marca, como en la imagen de referencia)
  const cx = (p.sh[0] + p.hp[0]) / 2, cy = (p.sh[1] + p.hp[1]) / 2;
  s += `<path d="M${cx + 2},${cy - 7} l-5,7 h4 l-3,7 l7,-9 h-4 z" fill="#fff"/>`;
  s += limb([p.hp, ...p.legF], 10) + foot(p.legF.at(-1));
  // Cabeza + pelo
  s += `<circle cx="${p.head[0]}" cy="${p.head[1]}" r="10" fill="${C.skin}" stroke="${C.line}" stroke-width="2.5"/>
        <path d="M${p.head[0] - 10},${p.head[1] - 1} q2,-13 12,-12 q9,1 8,8 q-6,-4 -11,-1 q-5,2 -9,5z" fill="${C.line}"/>`;
  s += limb([p.sh, ...p.armF], 8);
  return s;
}
function foot([x, y]) {

/* =========================================================
   3) DATOS
   Estructura:
   - routines: { pecho: [ {id, name, equip, mode} ], ... }
   - sessions: [ {id, day, date:'2026-11-24', entries:[ {exId, name, equip, mode, sets:[{w, r}]} ]} ]
   Guardamos el nombre/equipo también dentro de cada sesión:
   así, si después borrás el ejercicio de la rutina, tu
   historial no se rompe.
   ========================================================= */
const DAYS = [
  { id: 'pecho', name: 'Pecho' },
  { id: 'espalda', name: 'Espalda' },
  { id: 'piernas', name: 'Piernas' },
  { id: 'mix1', name: 'Mix 1' },
  { id: 'mix2', name: 'Mix 2' },
];
const uid = () => Math.random().toString(36).slice(2, 10);
const ex = (name, equip, mode = 'total') => ({ id: uid(), name, equip, mode });

const DEFAULT_ROUTINES = {
  pecho: [ex('Press banca plano', 'barra'), ex('Press inclinado', 'mancuerna', 'lado'), ex('Chest press', 'maquina'), ex('Cruce de poleas', 'polea'), ex('Fondos', 'corporal')],
  espalda: [ex('Dominadas', 'corporal'), ex('Jalón al pecho', 'polea'), ex('Remo con barra', 'barra'), ex('Remo con mancuerna', 'mancuerna', 'lado')],
  piernas: [ex('Sentadilla en Smith', 'smith', 'lado'), ex('Prensa 45°', 'prensa', 'lado'), ex('Extensión de cuádriceps', 'maquina'), ex('Curl femoral', 'maquina')],
  mix1: [ex('Press militar', 'barra'), ex('Elevaciones laterales', 'mancuerna', 'lado'), ex('Curl de bíceps', 'mancuerna', 'lado'), ex('Tríceps en polea', 'polea')],
  mix2: [ex('Kettlebell swing', 'kettlebell'), ex('Abdominales en polea', 'polea'), ex('Cinta', 'cardio')],
};

const KEY = 'ironlog-v1';
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.routines && d.sessions) return d;
  } catch (e) { /* si el JSON está roto, arrancamos de cero */ }
  return { routines: structuredClone(DEFAULT_ROUTINES), sessions: [] };
}
let db = load();
const save = () => localStorage.setItem(KEY, JSON.stringify(db));

/* ---------- Utilidades de fechas ---------- */
// Ojo: new Date('2026-11-24') se interpreta en UTC y puede "correrse" un día.
// Por eso armamos la fecha a mano en hora local.
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => fmtISO(new Date());
function weekStart(d) { // lunes de esa semana
  const x = new Date(d); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x;
}
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtShort = d => d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
const fmtLong = s => parseD(s).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });

/* ---------- Cálculos de peso ---------- */
// "Por lado" = lo que cargás en UN lado (ej: prensa). El total es el doble.
const totalKg = (w, mode) => (Number(w) || 0) * (mode === 'lado' ? 2 : 1);
const sessionVolume = s => s.entries.reduce((a, e) => a + e.sets.reduce((b, st) => b + totalKg(st.w, e.mode) * (Number(st.r) || 0), 0), 0);
const dayName = id => DAYS.find(d => d.id === id)?.name ?? id;

// Escapamos texto del usuario antes de meterlo en HTML (evita que un "<" rompa la página)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================
   4) PANTALLA DE INICIO
   ========================================================= */
let weekOffset = 0; // 0 = semana actual, -1 = la anterior, etc.

function renderHome() {
  const ws = weekStart(new Date());

  const sets = inWeek.reduce((a, s) => a + s.entries.reduce((b, e) => b + e.sets.length, 0), 0);
  const vol = inWeek.reduce((a, s) => a + sessionVolume(s), 0);
  const doneTypes = new Set(inWeek.map(s => s.day)).size;
  const pct = Math.round(doneTypes / DAYS.length * 100);
  const last = [...db.sessions].sort((a, b) => b.date.localeCompare(a.date))[0];

  return `

          <div><small>Volumen</small><b>${Math.round(vol).toLocaleString('es-AR')} kg</b></div>

      <div class="glass stat">

}

// Sugiere la próxima rutina: la primera que todavía no hiciste esta semana
function nextDay() {
  const ws = weekStart(new Date());
  const done = new Set(db.sessions.filter(s => parseD(s.date) >= ws).map(s => s.day));
  return (DAYS.find(d => !done.has(d.id)) || DAYS[0]).id;
}

function renderWeek() {
  const ws = addDays(weekStart(new Date()), weekOffset * 7);
  const names = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const t = today();
  const weekSessions = [];
  const cells = names.map((n, i) => {
    const d = addDays(ws, i); const iso = fmtISO(d);
    const ss = db.sessions.filter(s => s.date === iso);
    weekSessions.push(...ss);
    return `<div class="glass wd ${iso === t ? 'today' : ''}">
      <span class="dname">${n}</span><span class="dnum">${d.getDate()}</span>
      ${ss.map(s => `<a class="chip" href="#/dia/${s.day}/${s.date}">${dayName(s.day)}</a>`).join('')}
    </div>`;
  }).join('');

  // Tabla: cada ejercicio hecho en la semana con su mejor peso
  const rows = weekSessions.flatMap(s => s.entries.filter(e => e.sets.length).map(e => {
    const best = Math.max(...e.sets.map(st => totalKg(st.w, e.mode)));
    const detail = e.sets.map(st => `${st.w || 0}${e.mode === 'lado' ? '×2' : ''}kg × ${st.r || 0}`).join(' · ');
    return `<tr><td>${fmtShort(parseD(s.date))}</td><td>${dayName(s.day)}</td><td>${esc(e.name)}</td><td>${detail}</td><td><b>${best} kg</b></td></tr>`;
  })).join('');

  return `
    <div class="sec-head">
      <div><h2>Registro semanal</h2><p>Qué entrenaste cada día y con cuánto peso. <a href="#/calendario" style="color:var(--ink)">Ver calendario completo →</a></p></div>
      <div class="week-nav">
        <button class="icon-btn" onclick="weekOffset--;rerender()" aria-label="Semana anterior">‹</button>
        <span>${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}</span>
        <button class="icon-btn" onclick="weekOffset++;rerender()" aria-label="Semana siguiente">›</button>
      </div>
    </div>
    <div class="week-grid">${cells}</div>
    <div class="glass week-table">
      ${rows ? `<table><thead><tr><th>Fecha</th><th>Rutina</th><th>Ejercicio</th><th>Series</th><th>Máx. total</th></tr></thead><tbody>${rows}</tbody></table>`
             : `<div class="empty">No hay pesos anotados esta semana.</div>`}
    </div>`;
}

/* =========================================================
   5) PANTALLA DE UN DÍA (Pecho, Espalda, ...)
   "draft" es el borrador de la sesión que estás cargando.
   Recién se guarda en db cuando tocás "Guardar".
   ========================================================= */
let draft = null; // {day, date, entries:[...]}

// Ejercicios donde con las reps alcanza (no siempre hay peso)
const NO_WEIGHT_OK = ['corporal', 'cardio'];

// Busca la última vez que hiciste ese ejercicio ANTES de la fecha elegida.
// Devuelve { date, entry } o null.
function prevEntry(exId, beforeDate) {
  const prev = db.sessions.filter(s => s.date < beforeDate && s.entries.some(e => e.exId === exId))
    .sort((a, b) => b.date.localeCompare(a.date))[0];
  return prev ? { date: prev.date, entry: prev.entries.find(e => e.exId === exId) } : null;
}

function buildDraft(day, date) {
  const existing = db.sessions.find(s => s.day === day && s.date === date);
  const routine = db.routines[day];
  let fromDate = null; // fecha de la sesión desde la que precargamos
  const entries = routine.map(r => {
    const old = existing?.entries.find(e => e.exId === r.id);
    // Caso 1: ya había sesión ESE día → la mostramos tal cual para editarla
    if (old) return { exId: r.id, name: r.name, equip: r.equip, mode: old.mode, sets: structuredClone(old.sets) };
    // Caso 2: sesión nueva → copiamos la "forma" de la última vez:
    // misma cantidad de series y mismas reps, pero el PESO vacío para que lo completes.
    // El peso anterior queda como "pista" gris (ph = placeholder).
    const prev = existing ? null : prevEntry(r.id, date);
    if (prev) {
      if (!fromDate || prev.date > fromDate) fromDate = prev.date;
      return { exId: r.id, name: r.name, equip: r.equip, mode: prev.entry.mode,
               sets: prev.entry.sets.map(s => ({ w: '', r: s.r, ph: s.w })) };
    }
    // Caso 3: ejercicio que nunca hiciste → una serie vacía
    return { exId: r.id, name: r.name, equip: r.equip, mode: r.mode, sets: [{ w: '', r: '' }] };
  });
  draft = { day, date, entries, editing: !!existing, fromDate };
}

function lastTime(exId, beforeDate) {
  const p = prevEntry(exId, beforeDate);
  if (!p) return '';
  const best = Math.max(0, ...p.entry.sets.map(st => totalKg(st.w, p.entry.mode)));
  return `Última vez (${fmtShort(parseD(p.date))}): ${p.entry.sets.length} series · máx ${best} kg total`;
}

// Copia los pesos de la última vez (los que estaban como pista gris)
function copyWeights(i) {
  const list = i === undefined ? draft.entries : [draft.entries[i]];
  list.forEach(e => e.sets.forEach(s => { if (s.w === '' && s.ph !== undefined) s.w = s.ph; }));
  rerender(false);
}

function renderDay(day) {
  const d = DAYS.find(x => x.id === day);
  const hist = db.sessions.filter(s => s.day === day).sort((a, b) => b.date.localeCompare(a.date));

  // Agrupamos el historial por semana
  let lastWeek = '';
  const histHTML = hist.map(s => {
    const wk = fmtShort(weekStart(parseD(s.date)));
    const label = wk !== lastWeek ? `<div class="week-label">Semana del ${wk}</div>` : '';
    lastWeek = wk;
    return `${label}<div class="glass h-item">
      <div><b style="text-transform:capitalize">${fmtLong(s.date)}</b>
      <small>${s.entries.filter(e => e.sets.length).length} ejercicios · ${Math.round(sessionVolume(s)).toLocaleString('es-AR')} kg de volumen</small></div>
      <div style="display:flex;gap:8px">
        <a class="btn btn-ghost btn-sm" href="#/dia/${day}/${s.date}">Ver / editar</a>
        <button class="icon-btn danger" onclick="deleteSession('${s.id}')" aria-label="Borrar sesión">×</button>
      </div></div>`;
  }).join('');

  return `
  <div class="day-hero">
    <div>
      <div class="eyebrow">Día de entrenamiento</div>
      <h1>${d.name}</h1>
    </div>
    <div class="glass date-box">
      <label for="dateIn">¿Qué día lo hiciste?</label>
      <input type="date" id="dateIn" value="${draft.date}" onchange="location.hash='#/dia/${day}/'+this.value">
      <span class="status">${draft.editing ? '✎ Editando sesión guardada' : '+ Nueva sesión'}</span>
    </div>
  </div>

  <div class="sec-head">
    <div><h2>Rutina</h2><p>Queda guardada sola: la próxima vez vas a encontrar estos mismos ejercicios.</p></div>
    <button class="btn btn-ghost" onclick="openModal()">+ Agregar ejercicio</button>
  </div>

  ${draft.fromDate ? `<div class="glass banner">
    <div><b>Rutina cargada desde tu sesión del ${fmtShort(parseD(draft.fromDate))}</b>
    <small>Mismas series y reps. Solo completá los pesos — en gris ves lo que levantaste la última vez.</small></div>
    <button class="btn btn-ghost btn-sm" onclick="copyWeights()">↺ Repetir todos los pesos</button>
  </div>` : ''}

  <div class="ex-list">
    ${draft.entries.length ? draft.entries.map((e, i) => renderEx(e, i)).join('') : `<div class="glass empty">Tu rutina está vacía. Agregá tu primer ejercicio.</div>`}
  </div>

  <div class="glass save-bar">
    <span style="font-size:var(--fs-sm)">${draft.entries.length} ejercicios · <span style="text-transform:capitalize">${fmtLong(draft.date)}</span></span>
    <button class="btn btn-primary" onclick="saveSession()">${draft.editing ? 'Actualizar' : 'Guardar'} entrenamiento ↗</button>
  </div>

  <section>
    <div class="sec-head"><div><h2>Historial de ${d.name}</h2><p>Tus sesiones anteriores, agrupadas por semana.</p></div></div>
    <div class="history">${histHTML || '<div class="glass empty">Todavía no guardaste ninguna sesión de este día.</div>'}</div>
  </section>`;
}

function renderEx(e, i) {
  const lado = e.mode === 'lado';
  return `<article class="glass ex">
    <div class="ill">${EQUIP[e.equip].svg()}</div>
    <div>
      <div class="ex-top">
        <div><h3>${esc(e.name)}</h3><span class="tag">${EQUIP[e.equip].label}</span></div>
        <div class="ex-actions">
          <button class="icon-btn" onclick="moveEx(${i},-1)" aria-label="Subir">↑</button>
          <button class="icon-btn" onclick="moveEx(${i},1)" aria-label="Bajar">↓</button>
          <button class="icon-btn danger" onclick="removeEx(${i})" aria-label="Quitar de la rutina">×</button>
        </div>
      </div>
      <div class="hint">${lastTime(e.exId, draft.date)}
        ${e.sets.some(s => s.w === '' && s.ph !== undefined) ? `<button class="link-btn" onclick="copyWeights(${i})">↺ mismos pesos</button>` : ''}</div>
      <div class="seg" role="group" aria-label="Tipo de peso">
        <button class="${!lado ? 'on' : ''}" onclick="setMode(${i},'total')">Peso total</button>
        <button class="${lado ? 'on' : ''}" onclick="setMode(${i},'lado')">Por lado</button>
      </div>
      <div class="sets">
        ${e.sets.map((st, j) => `
        <div class="set-row">
          <span class="n">${j + 1}</span>
          <label class="field"><input type="number" inputmode="decimal" min="0" step="0.5" value="${st.w}" placeholder="${st.ph !== undefined && st.ph !== '' ? esc(st.ph) : '0'}"
              oninput="setVal(${i},${j},'w',this.value)" aria-label="Peso serie ${j + 1}"><span>${lado ? 'kg/lado' : 'kg'}</span></label>
          <label class="field"><input type="number" inputmode="numeric" min="0" step="1" value="${st.r}" placeholder="0"
              oninput="setVal(${i},${j},'r',this.value)" aria-label="Repeticiones serie ${j + 1}"><span>reps</span></label>
          <span class="total" id="tot-${i}-${j}">${lado ? '= ' + totalKg(st.w, 'lado') + ' kg' : ''}</span>
          <button class="icon-btn danger" onclick="removeSet(${i},${j})" aria-label="Quitar serie">−</button>
        </div>`).join('')}
        <button class="btn btn-ghost btn-sm add-set" onclick="addSet(${i})">+ Serie</button>
      </div>
    </div>
  </article>`;
}

/* ---------- Acciones sobre el borrador ---------- */
function setVal(i, j, k, v) {
  draft.entries[i].sets[j][k] = v;
  // Actualizamos solo el "= X kg" sin redibujar todo (si redibujáramos, perderías el foco del input)
  const e = draft.entries[i];
  if (k === 'w' && e.mode === 'lado') document.getElementById(`tot-${i}-${j}`).textContent = '= ' + totalKg(v, 'lado') + ' kg';
}
function addSet(i) {
  const s = draft.entries[i].sets; const prev = s.at(-1);
  s.push({ w: prev?.w ?? '', r: prev?.r ?? '' }); // copia la serie anterior: casi siempre repetís peso
  rerender(false);
}
function removeSet(i, j) { draft.entries[i].sets.splice(j, 1); rerender(false); }
function setMode(i, m) {
  draft.entries[i].mode = m;
  const r = db.routines[draft.day].find(x => x.id === draft.entries[i].exId);
  if (r) { r.mode = m; save(); } // recordamos tu preferencia para la próxima vez
  rerender(false);
}
function moveEx(i, dir) {
  const j = i + dir; const list = db.routines[draft.day];
  if (j < 0 || j >= draft.entries.length) return;
  [draft.entries[i], draft.entries[j]] = [draft.entries[j], draft.entries[i]];
  [list[i], list[j]] = [list[j], list[i]];
  save(); rerender(false);
}
function removeEx(i) {
  if (!confirm(`¿Quitar "${draft.entries[i].name}" de la rutina de ${dayName(draft.day)}? (El historial se conserva)`)) return;
  db.routines[draft.day].splice(i, 1); draft.entries.splice(i, 1); save(); rerender(false);
}
function saveSession() {
  // Qué series guardamos:
  // - Con peso cargado → siempre.
  // - Sin peso → solo en peso corporal / cardio (ahí las reps solas tienen sentido).
  // Así, si salteaste un ejercicio y solo quedaron las reps precargadas, no se guarda "basura".
  const entries = draft.entries.map(e => ({
    exId: e.exId, name: e.name, equip: e.equip, mode: e.mode,
    sets: e.sets.filter(s => s.w !== '' || (NO_WEIGHT_OK.includes(e.equip) && s.r !== ''))
                .map(s => ({ w: s.w, r: s.r })) // sacamos la "pista" ph antes de guardar
  }));
  if (!entries.some(e => e.sets.length)) { toast('Cargá al menos un peso antes de guardar'); return; }
  const idx = db.sessions.findIndex(s => s.day === draft.day && s.date === draft.date);
  const session = { id: idx >= 0 ? db.sessions[idx].id : uid(), day: draft.day, date: draft.date, entries };
  if (idx >= 0) db.sessions[idx] = session; else db.sessions.push(session);
  save(); draft.editing = true; toast('¡Entrenamiento guardado! 💪'); rerender(false);
}
function deleteSession(id) {
  const s = db.sessions.find(x => x.id === id);
  if (!confirm(`¿Borrar la sesión del ${fmtLong(s.date)}? No se puede deshacer.`)) return;
  db.sessions = db.sessions.filter(x => x.id !== id); save();
  if (draft && draft.date === s.date && draft.day === s.day) buildDraft(draft.day, draft.date);
  rerender(false);
}

/* =========================================================
   5b) CALENDARIO + PROGRESO POR EJERCICIO
   El calendario es una grilla de 7 columnas (lun → dom).
   Para que el día 1 caiga en la columna correcta, arrancamos
   desde el LUNES de la semana del día 1 (aunque sea del mes anterior).
   ========================================================= */
let calOffset = 0;   // 0 = mes actual, -1 = mes anterior...
let progEx = null;   // id del ejercicio elegido en "Progreso"

function renderCalendar(selDate) {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const month = first.getMonth();
  const start = weekStart(first);
  const t = today();

  let cells = '';
  for (let i = 0; i < 42; i++) { // 6 semanas x 7 días cubre cualquier mes
    const d = addDays(start, i); const iso = fmtISO(d);
    if (i >= 35 && d.getMonth() !== month) break; // si la 6ª semana sobra, no la dibujamos
    const ss = db.sessions.filter(s => s.date === iso);
    cells += `<a href="#/calendario/${iso}" class="cal-day ${d.getMonth() !== month ? 'out' : ''} ${iso === t ? 'today' : ''} ${iso === selDate ? 'sel' : ''} ${ss.length ? 'has' : ''}">
      <span>${d.getDate()}</span>
      ${ss.map(s => `<i class="dot">${dayName(s.day)}</i>`).join('')}
    </a>`;
  }
  const title = first.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });

  return `
  <div class="day-hero">
    <div><div class="eyebrow">Tu historial completo</div><h1>Calendario</h1></div>
  </div>

  <div class="cal-layout">
    <div class="glass cal">
      <div class="cal-head">
        <button class="icon-btn" onclick="calOffset--;rerender(false)" aria-label="Mes anterior">‹</button>
        <b style="text-transform:capitalize">${title}</b>
        <button class="icon-btn" onclick="calOffset++;rerender(false)" aria-label="Mes siguiente">›</button>
      </div>
      <div class="cal-grid">
        ${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(n => `<span class="cal-wd">${n}</span>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="glass cal-detail">${renderDayDetail(selDate)}</div>
  </div>

  <section>${renderProgress()}</section>`;
}

// Panel derecho: qué hiciste el día elegido, ejercicio por ejercicio
function renderDayDetail(date) {
  if (!date) return `<div class="empty">Tocá un día del calendario para ver qué levantaste.</div>`;
  const ss = db.sessions.filter(s => s.date === date);
  const head = `<h3 class="det-title">${fmtLong(date)}</h3>`;
  if (!ss.length) return head + `<div class="empty">Ese día no entrenaste.</div>`;
  return head + ss.map(s => `
    <div class="det-session">
      <div class="det-top"><span class="chip">${dayName(s.day)}</span>
        <a class="btn btn-ghost btn-sm" href="#/dia/${s.day}/${s.date}">Editar</a></div>
      ${s.entries.filter(e => e.sets.length).map(e => `
        <div class="det-ex">
          <b>${esc(e.name)}</b>
          <small>${e.sets.map(st => st.w !== '' ? `${st.w}${e.mode === 'lado' ? ' kg/lado' : ' kg'} × ${st.r || 0}` : `${st.r} reps`).join(' · ')}</small>
        </div>`).join('')}
    </div>`).join('');
}

// Tabla de progreso: una fila por sesión en la que hiciste ese ejercicio
function renderProgress() {
  // Juntamos todos los ejercicios que aparecen en tus sesiones (sin repetir)
  const all = new Map();
  db.sessions.forEach(s => s.entries.forEach(e => { if (e.sets.length) all.set(e.exId, e.name); }));
  const head = `<div class="sec-head"><div><h2>Progreso por ejercicio</h2>
    <p>Cuánto levantaste cada semana y cuánto subiste o bajaste.</p></div>`;
  if (!all.size) return head + `</div><div class="glass empty">Cuando guardes entrenamientos, acá vas a ver tu evolución.</div>`;
  if (!all.has(progEx)) progEx = all.keys().next().value;

  const rows = db.sessions
    .filter(s => s.entries.some(e => e.exId === progEx && e.sets.length))
    .sort((a, b) => a.date.localeCompare(b.date))
    .map(s => {
      const e = s.entries.find(e => e.exId === progEx);
      const best = Math.max(0, ...e.sets.map(st => totalKg(st.w, e.mode)));
      return { date: s.date, best, e };
    });

  // Calculamos la diferencia contra la sesión ANTERIOR (por eso recorremos en orden de fecha)
  const body = rows.map((r, i) => {
    const diff = i ? r.best - rows[i - 1].best : null;
    const badge = diff === null ? '<span class="delta">—</span>'
      : diff > 0 ? `<span class="delta up">▲ +${diff} kg</span>`
      : diff < 0 ? `<span class="delta down">▼ ${diff} kg</span>`
      : '<span class="delta">= igual</span>';
    return `<tr>
      <td>Semana del ${fmtShort(weekStart(parseD(r.date)))}</td>
      <td><a href="#/calendario/${r.date}">${fmtShort(parseD(r.date))}</a></td>
      <td>${r.e.sets.map(st => `${st.w || 0}${r.e.mode === 'lado' ? '×2' : ''} × ${st.r || 0}`).join(' · ')}</td>
      <td><b>${r.best} kg</b></td><td>${badge}</td></tr>`;
  }).reverse().join(''); // lo más reciente arriba

  const firstB = rows[0].best, lastB = rows.at(-1).best;
  return head + `
    <select class="select" onchange="progEx=this.value;rerender(false)" aria-label="Elegir ejercicio">
      ${[...all].map(([id, n]) => `<option value="${id}" ${id === progEx ? 'selected' : ''}>${esc(n)}</option>`).join('')}
    </select></div>
    <div class="glass week-table">
      <div class="prog-sum">De <b>${firstB} kg</b> a <b>${lastB} kg</b> en ${rows.length} sesiones
        ${lastB - firstB > 0 ? `<span class="delta up">▲ +${lastB - firstB} kg en total</span>` : ''}</div>
      <table><thead><tr><th>Semana</th><th>Fecha</th><th>Series</th><th>Máx. total</th><th>vs. anterior</th></tr></thead>
      <tbody>${body}</tbody></table>
    </div>`;
}

/* ---------- Modal: agregar ejercicio ---------- */
let modalEquip = 'maquina', modalMode = 'total';
function openModal() {
  modalEquip = 'maquina'; modalMode = 'total';
  document.getElementById('exName').value = '';
  paintModal();
  document.getElementById('modal').classList.add('open');
  document.getElementById('exName').focus();
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function paintModal() {
  document.getElementById('equipGrid').innerHTML = Object.entries(EQUIP).map(([k, v]) =>
    `<button type="button" class="equip ${k === modalEquip ? 'on' : ''}" onclick="modalEquip='${k}';paintModal()">${v.svg()}${v.label}</button>`).join('');
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === modalMode));
}
document.getElementById('modeSeg').addEventListener('click', e => { if (e.target.dataset.mode) { modalMode = e.target.dataset.mode; paintModal(); } });
document.getElementById('cancelEx').onclick = closeModal;
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('saveEx').onclick = () => {
  const name = document.getElementById('exName').value.trim();
  if (!name) { toast('Poné un nombre al ejercicio'); return; }
  const n = ex(name, modalEquip, modalMode);
  db.routines[draft.day].push(n);
  draft.entries.push({ exId: n.id, name, equip: modalEquip, mode: modalMode, sets: [{ w: '', r: '' }] });
  save(); closeModal(); rerender(false); toast(`"${name}" agregado`);
};

/* =========================================================
   6) RUTEO SIMPLE CON EL HASH DE LA URL
   #/                  → inicio
   #/dia/pecho         → pecho, fecha de hoy
   #/dia/pecho/2026-11-20 → pecho de ese día
   Así cada sección tiene su propio "link" y el botón Atrás funciona.
   ========================================================= */
function route() {
  const [, page, day, date] = location.hash.split('/');
  if (page === 'dia' && DAYS.some(d => d.id === day)) {
    const dt = /^\d{4}-\d{2}-\d{2}$/.test(date || '') ? date : today();
    buildDraft(day, dt);
    return { view: 'day', day };
  }
  if (page === 'calendario') {
    const sel = /^\d{4}-\d{2}-\d{2}$/.test(day || '') ? day : null;
    // Si elegiste un día de otro mes (ej: desde la tabla de progreso), movemos el calendario a ese mes
    if (sel) { const d = parseD(sel), n = new Date(); calOffset = (d.getFullYear() - n.getFullYear()) * 12 + d.getMonth() - n.getMonth(); }
    return { view: 'cal', sel };
  }
  return { view: 'home' };
}
let current = route();
function rerender(scrollTop = true) {
  const y = window.scrollY;
  const app = document.getElementById('app');
  app.innerHTML = current.view === 'day' ? renderDay(current.day)
                : current.view === 'cal' ? renderCalendar(current.sel)
                : renderHome();
  document.getElementById('navLinks').innerHTML = DAYS.map(d =>
    `<a href="#/dia/${d.id}" class="${current.day === d.id ? 'on' : ''}">${d.name}</a>`).join('')
    + `<a href="#/calendario" class="${current.view === 'cal' ? 'on' : ''}">📅 Calendario</a>`;
  window.scrollTo(0, scrollTop ? 0 : y);
}
window.addEventListener('hashchange', () => {
  const wasCal = current.view === 'cal';
  current = route();
  // Dentro del calendario no saltamos arriba al tocar un día (sería molesto)
  rerender(!(wasCal && current.view === 'cal'));
});
rerender();
</script>
